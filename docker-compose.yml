services:
  api:
    build: .
    container_name: ai_ticket_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATA_PATH: /app/app/data/enhanced_customer_support_data.csv
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    container_name: ai_ticket_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
